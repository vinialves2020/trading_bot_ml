version: '3.8'

services:
  finbert_api:
    build: .
    image: oraculo_base_image:latest
    container_name: finbert_api
    restart: unless-stopped
    command: uvicorn src.api_finbert:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface   # Persiste o modelo entre restarts
    deploy:
      resources:
        limits:
          memory: 1.2G     # Loading spike: ~1.1GB temporário, estabiliza em ~680MB
          cpus: '1.5'
        reservations:
          memory: 600M

  oraculo_btc:
    image: oraculo_base_image:latest
    container_name: oraculo_btc_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol BTC/USDT --timeframe 15m --paper
    volumes:
      - ./data:/app/data
    depends_on:
      - finbert_api
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.4'

  oraculo_eth:
    image: oraculo_base_image:latest
    container_name: oraculo_eth_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol ETH/USDT --timeframe 1h --paper
    volumes:
      - ./data:/app/data
    depends_on:
      - finbert_api
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.4'

  oraculo_sol:
    image: oraculo_base_image:latest
    container_name: oraculo_sol_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol SOL/USDT --timeframe 15m --paper
    volumes:
      - ./data:/app/data
    depends_on:
      - finbert_api
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.4'

  dashboard:
    image: oraculo_base_image:latest
    container_name: oraculo_dashboard
    restart: unless-stopped
    command: streamlit run src/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "80:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - oraculo_btc
      - oraculo_eth
      - oraculo_sol
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.3'

# Volume nomeado: o Docker mantém o cache do HuggingFace no disco do servidor.
# Próximos restarts do finbert_api carregam o modelo da RAM em segundos.
volumes:
  hf_cache: