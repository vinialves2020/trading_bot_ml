version: '3.8'

services:
  finbert_api:
    build: .
    image: oraculo_base_image:latest
    container_name: finbert_api
    restart: unless-stopped
    command: uvicorn src.api_finbert:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  oraculo_btc:
    image: oraculo_base_image:latest
    container_name: oraculo_btc_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol BTC/USDT --timeframe 15m --paper
    volumes:
      - ./data:/app/data
    depends_on:
      - finbert_api

  oraculo_eth:
    image: oraculo_base_image:latest
    container_name: oraculo_eth_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol ETH/USDT --timeframe 1h --paper
    volumes:
      - ./data:/app/data
    depends_on:
      - finbert_api

  oraculo_sol:
    image: oraculo_base_image:latest
    container_name: oraculo_sol_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol SOL/USDT --timeframe 15m --paper
    volumes:
      - ./data:/app/data
    depends_on:
      - finbert_api

  dashboard:
    image: oraculo_base_image:latest
    container_name: oraculo_dashboard
    restart: unless-stopped
    command: streamlit run src/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "80:8501"
    volumes:
      - ./data:/app/data
    depends_on:
      - oraculo_btc
      - oraculo_eth
      - oraculo_sol