version: '3.8'

services:
  oraculo_btc:
    build: .
    container_name: oraculo_btc_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol BTC/USDT --timeframe 15m --paper
    volumes:
      - ./data:/app/data  # Sincroniza a pasta data do container com a AWS

  oraculo_eth:
    build: .
    container_name: oraculo_eth_bot
    restart: unless-stopped
    command: python src/bot_executor.py --symbol ETH/USDT --timeframe 1h --paper
    volumes:
      - ./data:/app/data  # Sincroniza a pasta data do container com a AWS

  dashboard:
    build: .
    container_name: oraculo_dashboard
    restart: unless-stopped
    # Roda o Streamlit em vez do bot
    command: streamlit run src/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "80:8501"
    volumes:
      - ./data:/app/data  # Lê a mesma pasta que o bot escreve
    depends_on:
      - oraculo_btc
      - oraculo_eth